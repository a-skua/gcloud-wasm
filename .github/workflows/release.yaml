run-name: Release ${{ inputs.version }}
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

permissions: {}

jobs:
  build-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup target add wasm32-wasip2

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            auth/target
          key: build-auth-${{ hashFiles('auth/Cargo.lock') }}

      - run: cargo build --release --target wasm32-wasip2
        working-directory: auth

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcloud_auth.wasm
          path: auth/target/wasm32-wasip2/release/gcloud_auth.wasm

  build-storage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup target add wasm32-wasip2

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            storage/target
          key: build-storage-${{ hashFiles('storage/Cargo.lock') }}

      - run: cargo build --release --target wasm32-wasip2
        working-directory: storage

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcloud_storage.wasm
          path: storage/target/wasm32-wasip2/release/gcloud_storage.wasm

  build-secretmanager:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup target add wasm32-wasip2

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            secretmanager/target
          key: build-secretmanager-${{ hashFiles('secretmanager/Cargo.lock') }}

      - run: cargo build --release --target wasm32-wasip2
        working-directory: secretmanager

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcloud_secretmanager.wasm
          path: secretmanager/target/wasm32-wasip2/release/gcloud_secretmanager.wasm

  publish-auth:
    needs: build-auth
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_auth.wasm

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall wkg@0.15.0 -y

      - run: |
          wkg oci push \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }} \
            ghcr.io/a-skua/gcloud/auth:${{ inputs.version }} \
            gcloud_auth.wasm

  publish-storage:
    needs: build-storage
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_storage.wasm

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall wkg@0.15.0 -y

      - run: |
          wkg oci push \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }} \
            ghcr.io/a-skua/gcloud/storage:${{ inputs.version }} \
            gcloud_storage.wasm

  publish-secretmanager:
    needs: build-secretmanager
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_secretmanager.wasm

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall wkg@0.15.0 -y

      - run: |
          wkg oci push \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }} \
            ghcr.io/a-skua/gcloud/secretmanager:${{ inputs.version }} \
            gcloud_secretmanager.wasm

  release:
    needs: [build-auth, build-storage, build-secretmanager]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_auth.wasm

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_storage.wasm

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_secretmanager.wasm

      - run: |
          VERSION="${{ inputs.version }}"
          HASH=$(echo "${{ github.sha }}" | cut -c1-4)
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            gcloud_auth.wasm \
            gcloud_storage.wasm \
            gcloud_secretmanager.wasm \
          || gh release create "${VERSION}+${HASH}" \
            --title "${VERSION}+${HASH}" \
            --generate-notes \
            gcloud_auth.wasm \
            gcloud_storage.wasm \
            gcloud_secretmanager.wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
