run-name: Release ${{ inputs.version }}
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: [auth, storage, secretmanager, bigquery, pubsub, tasks]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup target add wasm32-wasip2

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ${{ matrix.component }}/target
          key: build-${{ matrix.component }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.component)) }}

      - run: cargo build --release --target wasm32-wasip2
        working-directory: ${{ matrix.component }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcloud_${{ matrix.component }}.wasm
          path: ${{ matrix.component }}/target/wasm32-wasip2/release/gcloud_${{ matrix.component }}.wasm

  build-wit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: [auth, storage, secretmanager, bigquery, pubsub, tasks]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall wkg@0.15.0 -y

      - run: wkg wit build -o ../gcloud_${{ matrix.component }}_wit.wasm
        working-directory: ${{ matrix.component }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcloud_${{ matrix.component }}_wit.wasm
          path: gcloud_${{ matrix.component }}_wit.wasm

  publish:
    needs: [build, build-wit]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        component: [auth, storage, secretmanager, bigquery, pubsub, tasks]
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_${{ matrix.component }}.wasm

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gcloud_${{ matrix.component }}_wit.wasm

      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
        env:
          BINSTALL_VERSION: 1.17.7

      - run: cargo binstall wkg@0.15.0 -y

      - run: |
          wkg oci push \
            ghcr.io/a-skua/gcloud/${{ matrix.component }}:${{ inputs.version }} \
            gcloud_${{ matrix.component }}_wit.wasm
        env:
          WKG_OCI_PASSWORD: ${{ github.token }}

      - run: |
          wkg oci push \
            ghcr.io/a-skua/gcloud/${{ matrix.component }}:${{ inputs.version }}-component \
            gcloud_${{ matrix.component }}.wasm
        env:
          WKG_OCI_PASSWORD: ${{ github.token }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          merge-multiple: true

      - run: |
          HASH=$(echo "${{ github.sha }}" | cut -c1-4)
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            gcloud_*.wasm \
          || gh release create "${VERSION}+${HASH}" \
            --title "${VERSION}+${HASH}" \
            --generate-notes \
            gcloud_*.wasm
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
