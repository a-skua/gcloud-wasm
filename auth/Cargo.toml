[package]
name = "gcloud_auth"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
percent-encoding = "2"
pkcs8 = { version = "0.10", features = ["pem"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std", "oid"] }
wasip2 = "1"
wit-bindgen = "0.53.1"
wstd = "0.6"
